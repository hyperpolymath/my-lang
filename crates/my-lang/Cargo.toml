[package]
name = "my-lang"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "My Language: A programming language with first-class AI integration"

[lib]
name = "my_lang"
path = "src/lib.rs"

[[bin]]
name = "my"
path = "src/main.rs"

[dependencies]
my-qtt.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde = { workspace = true, optional = true }
# Non-optional: json_parse / json_stringify stdlib builtins are always available
# to Solo programs (my-lang#47). serde derive stays behind the `serde` feature.
serde_json = { workspace = true }
tracing.workspace = true
clap.workspace = true
my-ai = { path = "../my-ai" }
tokio.workspace = true

dhat = { version = "0.3", optional = true }

[features]
default = []
serde = ["dep:serde"]
# Heap-profiling support for the #14 allocation investigation. Enables the
# `dhat_checker_profile` example, which runs the checker under the dhat
# allocator and writes a per-call-site `dhat-heap.json` (view at
# https://nnethercote.github.io/dh_view/dh_view.html). This is the
# cross-platform stand-in for the heaptrack/dhat localisation the issue
# asked for; it runs here on Linux and on the Windows CI job alike.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
pretty_assertions.workspace = true
proptest = "1.4"
my-hir = { path = "../my-hir" }
my-mir = { path = "../my-mir" }
my-ai = { path = "../my-ai" }
my-pkg = { path = "../my-pkg" }
toml = "0.8"

[[test]]
name = "integration_test"
path = "../../tests/integration_test.rs"

[[example]]
name = "dhat_checker_profile"
required-features = ["dhat-heap"]
