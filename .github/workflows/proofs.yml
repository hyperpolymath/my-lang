# SPDX-License-Identifier: MPL-2.0
# Proof CI — machine-checks the mechanised Solo-core on BOTH tracks.
#
# Closes the long-standing proof-ci = "absent" gap (STATE.a2ml /
# proofs/ALIGNMENT-PLAN.md Phase F5): "locally-checked" proofs become
# machine-verified on every PR that touches proofs/. Mirrors the
# echo-types agda.yml install-from-distro pattern. Direct `runs-on`
# jobs (so timeout-minutes + job permissions are valid and present —
# unlike the reusable-workflow callers in issue #95).
name: Proofs (Solo-core)

on:
  push:
    branches: [main]
    paths:
      - 'proofs/verification/**'
      - '.github/workflows/proofs.yml'
  pull_request:
    paths:
      - 'proofs/verification/**'
      - '.github/workflows/proofs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coq:
    name: Coq solo-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
          coqc --version | head -1

      - name: Build solo-core (dependency order via _CoqProject)
        working-directory: proofs/verification/coq/solo-core
        run: |
          coq_makefile -f _CoqProject -o CoqMakefile
          make -f CoqMakefile

      - name: Assert soundness + the usage-walk checker are axiom-free
        working-directory: proofs/verification/coq/solo-core
        run: |
          # The F1.4 headline: every soundness theorem must rest on the
          # bare global context — no Admitted/Axiom anywhere in its
          # dependency cone. A future regression that slips an `admit`
          # into the substitution/preservation chain fails the build here,
          # not silently at review time.
          # Theorems now live in the consolidated parametric functor
          # (SoloCore.v); `Include SoloCoreF Linear3` re-exports them under
          # bare names, recovering the axiom-free concrete development.
          # R5: check_sound / check_complete / check_correct are the
          # executable usage-walk checker's adequacy (static-split ≡
          # usage-walk); R5b: aff_type_dec decides the affine budget
          # judgement; M1: elab_data_check (data fragment) + me_wt_sound
          # (universal linear-use, M1.1b) are the me->solo elaboration
          # adequacy (Visual Soundness) — all asserted axiom-free here.
          for thm in progress preservation affine_pres \
                     check_sound check_complete check_correct aff_type_dec \
                     elab_data_check elab_data_typed elab_data_aff_budget \
                     me_wt_sound me_wt_check me_wt_aff; do
            echo "Require Import SoloCore. Print Assumptions ${thm}." \
              | coqtop -R . SoloCore 2>/dev/null | tee "/tmp/assum_${thm}.txt"
            grep -q "Closed under the global context" "/tmp/assum_${thm}.txt" \
              || { echo "::error::${thm} is NOT axiom-free"; exit 1; }
          done

      - name: Assert ensemble session-π S1.0 core + witnesses are axiom-free
        working-directory: proofs/verification/coq/solo-core
        run: |
          # S1 (axis-2 STRUCTURE): the ensemble session-typed π-calculus
          # core lives in the standalone SessionPi.v (module
          # SoloCore.SessionPi). S1.0 = definitions + executable witnesses.
          # The duality involution, the well-typed ping-pong, its
          # reductions, the S1.1a metatheory (value substitution +
          # communication-redex subject reduction), and the S1.1b
          # full closed-system subject reduction over the fused
          # two-party (νc)(P∣Q) form must all rest on the bare global
          # context.
          for thm in dual_involutive co_involutive \
                     wt_pingpong step_pingpong step_sys \
                     vtype_subst wt_subst wt_subst0 sr_comm \
                     pty_subst pty_subst0 config_subject_reduction \
                     wf_preserved_pingpong \
                     session_fidelity config_progress \
                     bget_dual_br bget_dual_br_inv pget_psubst \
                     wf_choice_config cstep_choice_config progress_choice \
                     csplit_comm csplit_assoc wt_absorb_ended \
                     wt_congr wt_congr_comm_witness \
                     dual_tlift dual_tsubst dual_unfold \
                     unfold_mu_compute guarded_recursive not_guarded_muvar; do
            echo "Require Import SoloCore.SessionPi. Print Assumptions ${thm}." \
              | coqtop -R . SoloCore 2>/dev/null | tee "/tmp/assum_sp_${thm}.txt"
            grep -q "Closed under the global context" "/tmp/assum_sp_${thm}.txt" \
              || { echo "::error::SessionPi.${thm} is NOT axiom-free"; exit 1; }
          done

      - name: Assert duet-by-projection S2 results are axiom-free
        working-directory: proofs/verification/coq/solo-core
        run: |
          # S2 (axis-2 STRUCTURE, "duet = ensemble | 2-party by projection"):
          # the multiparty-SHAPED global-type / projection layer (gty, proj,
          # two_party) and the BINARY COLLAPSE bridge into the S1.1b/S1.2 fused
          # config metatheory. projection_duality (a two-party choreography
          # projects to DUAL local types) + proj_q_dual_p, projected_config_wf,
          # and the transported guarantees (subject reduction / fidelity /
          # progress) + the round-trip global_projects_to_dual_channel must all
          # rest on the bare global context.
          for thm in projection_duality proj_q_dual_p \
                     projected_config_wf global_projects_to_dual_channel \
                     projected_config_subject_reduction \
                     projected_session_fidelity projected_config_progress; do
            echo "Require Import SoloCore.SessionPi. Print Assumptions ${thm}." \
              | coqtop -R . SoloCore 2>/dev/null | tee "/tmp/assum_s2_${thm}.txt"
            grep -q "Closed under the global context" "/tmp/assum_s2_${thm}.txt" \
              || { echo "::error::SessionPi.${thm} is NOT axiom-free"; exit 1; }
          done

      - name: Assert S2.2 choice+recursion projection + merge are axiom-free
        working-directory: proofs/verification/coq/solo-core
        run: |
          # S2.2 (axis-2 STRUCTURE): global labelled CHOICE (GBra) + equi-
          # recursive (GMu/GVar) global types projecting onto S1.3 local
          # select/branch/mu. Projection is now PARTIAL (option sty); the
          # uninvolved-role merge keystone (merge_idem), the option-form
          # duality bridge (proj_q_dual_p_some), the choice + recursion
          # duality witnesses (gchoice2_dual, grec_dual), and the B1
          # None-propagation regression (proj_tail_conflict_none — a tail
          # merge-conflict must yield None, not be erased to Some) must all
          # rest on the bare global context.
          for thm in merge_idem proj_q_dual_p_some \
                     gchoice2_dual grec_dual proj_tail_conflict_none; do
            echo "Require Import SoloCore.SessionPi. Print Assumptions ${thm}." \
              | coqtop -R . SoloCore 2>/dev/null | tee "/tmp/assum_s22_${thm}.txt"
            grep -q "Closed under the global context" "/tmp/assum_s22_${thm}.txt" \
              || { echo "::error::SessionPi.${thm} is NOT axiom-free"; exit 1; }
          done

      - name: Assert S3a n-party projection totality is axiom-free
        working-directory: proofs/verification/coq/solo-core
        run: |
          # S3a (axis-2 STRUCTURE): the FIRST theorem quantifying over a
          # genuine n>=3 role space. projection_total (projectable_wf G ->
          # forall r, exists s, proj G r = Some s) breaks the standing
          # "no theorem quantifies over a genuine n-party system" fence.
          # projectable_wf = the restricted (plain-merge) projectability
          # predicate; witnesses pin non-vacuity at n=3 (a 3-party ring +
          # an agreeing 3-party choice projected via a non-trivial merge)
          # and the plain-merge boundary (a same-direction different-payload
          # choice is NOT projectable). All must rest on the bare global ctx.
          for thm in projection_total proj_msg_total \
                     projectable_g_ring projectable_g_choice3 \
                     g_ring_projects_all g_ring_not_two_party \
                     g_excluded_not_projectable; do
            echo "Require Import SoloCore.SessionPi. Print Assumptions ${thm}." \
              | coqtop -R . SoloCore 2>/dev/null | tee "/tmp/assum_s3a_${thm}.txt"
            grep -q "Closed under the global context" "/tmp/assum_s3a_${thm}.txt" \
              || { echo "::error::SessionPi.${thm} is NOT axiom-free"; exit 1; }
          done

      - name: Assert S3b static n-party configuration is axiom-free
        working-directory: proofs/verification/coq/solo-core
        run: |
          # S3b (axis-2 STRUCTURE): the FIRST n-party CONFIGURATION form,
          # STATIC (no operational semantics). wf_assignment G ra = every
          # listed endpoint typed at its role's projection (In-based plain
          # Definition). The binary Conf is recovered as the n=2 INSTANCE via
          # conf_is_role_assignment2 (reusing projected_config_wf), with the
          # converse embed + lookup bridge. Non-vacuity at n=3 by wf_ra_ring
          # over g_ring. Honesty witnesses fence out functionality (duplicate
          # keys) and a general coverage theorem (projectable_but_uncoverable
          # — GVar/SVar uninhabited by closed parties). All bare global ctx.
          for thm in conf_is_role_assignment2 role_assignment2_of_conf \
                     ra_get_in wf_assignment_get \
                     wf_ra_ring ra_ring_three_entries \
                     wf_assignment_admits_duplicate_keys \
                     svar_uninhabited projectable_but_uncoverable; do
            echo "Require Import SoloCore.SessionPi. Print Assumptions ${thm}." \
              | coqtop -R . SoloCore 2>/dev/null | tee "/tmp/assum_s3b_${thm}.txt"
            grep -q "Closed under the global context" "/tmp/assum_s3b_${thm}.txt" \
              || { echo "::error::SessionPi.${thm} is NOT axiom-free"; exit 1; }
          done

      - name: Assert E4 residue-measure SEAM (Coq mirror) is axiom-free
        working-directory: proofs/verification/coq/solo-core
        run: |
          # E4 (axis-3 ECHO): the my-lang Coq half of the residue-measure
          # seam capstone. RESIDUE_MEASURE (ResourceAlgebra.v) is the monoid-
          # homomorphism interface mirrored from upstream EchoBridge.lean;
          # EchoMeasure.v inhabits it at the R4 Tropical cost carrier
          # (EchoTraceTropical) and witnesses measure-independence on the Coq
          # side (echo_measure_not_injective). The full measure-independence
          # over the degrade-compose modality is upstream-cited, not here.
          for thm in trace_cost_app \
                     EchoTraceTropical.measure_empty \
                     EchoTraceTropical.measure_combine \
                     echo_measure_not_injective; do
            echo "Require Import SoloCore.EchoMeasure. Print Assumptions ${thm}." \
              | coqtop -R . SoloCore 2>/dev/null | tee "/tmp/assum_e4_${thm}.txt"
            grep -q "Closed under the global context" "/tmp/assum_e4_${thm}.txt" \
              || { echo "::error::EchoMeasure.${thm} is NOT axiom-free"; exit 1; }
          done

      - name: Assert S3c.0 full label-union merge is axiom-free
        working-directory: proofs/verification/coq/solo-core
        run: |
          # S3c.0 (axis-2 STRUCTURE): the FIRST S3c sub-rung -- the
          # Honda-Yoshida-Carbone label-UNION merge (umerge) ADDED ALONGSIDE
          # the plain identity-meet merge (touches nothing S2/S3a/S3b use).
          # Keystone umerge_idem (unconditional). Witnesses pin the WIN
          # (different-label & choices plain merge rejects, umerge unions)
          # and the honest fences (SSelect + is NOT unioned; same-direction
          # different-PAYLOAD is STILL rejected -- umerge unions labels, it
          # does not reconcile payloads). Type-algebra only: NOT wired into
          # proj/coherence/safety (that is S3c.1+). All bare global ctx.
          for thm in umerge_idem sty_eqb_refl \
                     umerge_widens_strictly umerge_accepts_disjoint \
                     umerge_select_disjoint_rejected \
                     umerge_still_rejects_payload_divergence; do
            echo "Require Import SoloCore.SessionPi. Print Assumptions ${thm}." \
              | coqtop -R . SoloCore 2>/dev/null | tee "/tmp/assum_s3c0_${thm}.txt"
            grep -q "Closed under the global context" "/tmp/assum_s3c0_${thm}.txt" \
              || { echo "::error::SessionPi.${thm} is NOT axiom-free"; exit 1; }
          done

  idris:
    name: Idris2 solo-core
    runs-on: ubuntu-latest
    # Bound generously: a cold from-source Idris2 bootstrap is the slow
    # path (~15 min); the solo-core build itself is seconds.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Chez Scheme + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme make gcc git

      - name: Bootstrap Idris2 (v0.7.0)
        run: |
          git clone --depth 1 --branch v0.7.0 \
            https://github.com/idris-lang/Idris2.git /tmp/Idris2
          cd /tmp/Idris2
          make bootstrap SCHEME=chezscheme
          make install
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: Sanity-check toolchain
        run: idris2 --version

      # `%default total` across the solo-core means a failed totality
      # or coverage check fails the build — so a green build IS the
      # `progress is total` certificate (plus no ?todo holes except the
      # documented ?todo_preservation, which still type-checks).
      - name: Build solo-core (idris2 --build)
        working-directory: proofs/verification/idris/solo-core
        run: idris2 --build solo-core.ipkg
