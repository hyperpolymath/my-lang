[workspace]
resolver = "2"
members = [
    "crates/my-lang",
    "crates/my-cli",   # Command-line interface (my binary)
    "crates/my-hir",
    "crates/my-mir",
    "crates/my-llvm",  # LLVM code generation
    "crates/my-lsp",
    "crates/my-pkg",
    "crates/my-ai",
    "crates/my-fmt",
    "crates/my-lint",
    "crates/my-test",
    "crates/my-parser",
    "crates/my-debug",
    "crates/my-dap",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "PMPL-1.0-or-later"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/my-lang"

[workspace.dependencies]
# Internal crates
my-lang = { path = "crates/my-lang" }
my-hir = { path = "crates/my-hir" }
my-mir = { path = "crates/my-mir" }
my-llvm = { path = "crates/my-llvm" }
my-ai = { path = "crates/my-ai" }

# External dependencies
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
semver = "1.0"
petgraph = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-lsp = "0.20"
lsp-types = "0.94"
inkwell = { version = "0.8", features = ["llvm21-1"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }

[workspace.dependencies.pretty_assertions]
version = "1.4"
